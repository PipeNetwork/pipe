name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --workspace
      - name: Format
        run: cargo fmt --all --check
      - name: Check operation coverage
        run: python scripts/cli-coverage.py --check
      - name: Test
        run: cargo test --locked --workspace
