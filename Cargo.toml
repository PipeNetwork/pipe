[package]
name = "pipe"
version = "3.0.0-rc.1"
edition = "2021"

[dependencies]
pipe-api = { path = "crates/pipe-api" }
pipe-transports = { path = "crates/pipe-transports" }
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bytes = "1"
bs58 = "0.5"
blake3 = "1"
curve25519-dalek = "4"
fs2 = "0.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
indicatif = "0.17"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
percent-encoding = "2.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
quick-xml = { version = "0.38", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"

jsonschema = { version = "=0.48.5", default-features = false }

[workspace]
members = [".", "crates/pipe-api", "crates/pipe-transports"]
resolver = "2"

[dev-dependencies]
wiremock = "0.6"
